version: 2
updates:
  # Keeps GitHub Actions pinned versions current. Actions are executable
  # code running with repo access, so stale ones are a real supply-chain
  # exposure — this is worth having even before the app stack exists.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"

  # Add an entry per ecosystem once the stack is chosen, e.g.:
  #
  # - package-ecosystem: "npm"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   groups:
  #     dev-dependencies:
  #       dependency-type: "development"
