version: 2
updates:
  # Keeps GitHub Actions pinned versions current. Actions are executable
  # code running with repo access, so stale ones are a real supply-chain
  # exposure — this is worth having even before the app stack exists.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"

  # npm, grouped so a week of minor bumps is one pull request rather than
  # twenty. package.json is owned by T-01 for the life of the build plan
  # (docs/TASKS.md, File ownership), so these land as chore: PRs outside any
  # task lane.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
