<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aritzia Task Management · Presentation</title>
<style>
  :root {
    --ink: #1a1a1a;
    --ink-2: #555555;
    --ink-3: #8a8a8a;
    --paper: #ffffff;
    --paper-2: #f5f5f5;
    --line: #d0d0d0;
    --accent: #e8630a;
    --dark: #1a1a1a;
    --dark-2: #2a2a2a;
    --on-dark: #ffffff;
    --on-dark-2: #b8b8b8;
    --font: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--dark-2); color: var(--ink); font-family: var(--font); }
  body { overflow: hidden; }

  /* ── Stage: a 16:9 surface scaled to the viewport ─────────────────── */
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  .slide {
    width: 1280px; height: 720px; padding: 64px 80px; background: var(--paper);
    display: none; flex-direction: column; position: relative; overflow: hidden;
    transform-origin: center center;
  }
  .slide.active { display: flex; }
  .slide.dark { background: var(--dark); color: var(--on-dark); }
  .section { font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 18px; }
  .dark .section { color: var(--on-dark-2); }
  h1 { font-size: 40px; line-height: 1.12; margin: 0 0 16px; font-weight: 700; letter-spacing: -0.01em; }
  h1.big { font-size: 56px; }
  .lead { font-size: 19px; line-height: 1.45; color: var(--ink-2); margin: 0 0 26px; max-width: 1040px; }
  .dark .lead { color: var(--on-dark-2); }
  .num { position: absolute; right: 80px; bottom: 40px; font-size: 13px; color: var(--ink-3); }
  .dark .num { color: var(--on-dark-2); }
  .accent { color: var(--accent); }
  code, .mono { font-family: var(--mono); font-size: 0.92em; }

  /* title & close */
  .title-slide h1 { font-size: 60px; max-width: 980px; margin-top: auto; }
  .title-slide .sub { font-size: 22px; color: var(--on-dark-2); max-width: 900px; line-height: 1.4; }
  .title-slide .meta { margin-top: auto; font-size: 16px; color: var(--on-dark-2); line-height: 1.7; }
  .title-slide .meta .first { color: var(--on-dark); }
  .close-slide h1 { font-size: 52px; margin-top: auto; }
  .close-slide .lines { font-size: 20px; color: var(--on-dark-2); line-height: 1.8; margin-bottom: auto; }
  .close-slide .lines .first { color: var(--on-dark); font-size: 24px; }

  /* statement */
  .statement h1 { font-size: 48px; max-width: 1000px; }
  .statement p { font-size: 22px; line-height: 1.5; max-width: 1000px; margin: 0 0 18px; color: var(--ink-2); }
  .statement p:last-of-type { color: var(--ink); font-weight: 600; }

  /* cards */
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex: 1; align-content: start; }
  .card { background: var(--paper-2); border-radius: 10px; padding: 24px 26px; }
  .card h3 { margin: 0 0 8px; font-size: 18px; }
  .card p { margin: 0; font-size: 17px; line-height: 1.45; color: var(--ink-2); }

  /* table */
  table { border-collapse: collapse; width: 100%; font-size: 16.5px; }
  th { text-align: left; background: var(--dark); color: var(--on-dark); padding: 9px 12px; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }
  td { padding: 12px 12px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.35; }
  tr:nth-child(even) td { background: var(--paper-2); }
  td:first-child { font-weight: 600; width: 32%; }
  .three td:first-child { width: 18%; }

  /* trace */
  .trace { display: flex; flex-direction: column; gap: 12px; flex: 1; justify-content: center; }
  .step { display: grid; grid-template-columns: 150px 1fr; gap: 18px; align-items: start; }
  .step .label { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); padding-top: 6px; font-weight: 700; }
  .step .text { font-size: 17px; line-height: 1.4; padding: 8px 14px; background: var(--paper-2); border-radius: 8px; }
  .step .text.mono { font-family: var(--mono); font-size: 14.5px; }

  /* diagram */
  .flow { display: grid; grid-template-columns: 1fr 44px 1fr 44px 1fr; align-items: stretch; gap: 0; margin: 6px 0 24px; }
  .node { background: var(--paper-2); border-radius: 10px; padding: 18px 20px; }
  .node h3 { margin: 0 0 10px; font-size: 19px; }
  .node li { font-size: 16px; line-height: 1.4; color: var(--ink-2); margin-bottom: 6px; }
  .node ul { margin: 0; padding-left: 18px; }
  .arrow { display: grid; place-items: center; color: var(--accent); font-size: 28px; }
  .aside { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .aside p { margin: 0; font-size: 16px; line-height: 1.45; color: var(--ink-2); border-top: 2px solid var(--ink); padding-top: 10px; }

  /* columns */
  .cols { display: grid; gap: 24px; flex: 1; }
  .cols.n2 { grid-template-columns: 1fr 1fr; }
  .cols.n3 { grid-template-columns: 1fr 1fr 1fr; }
  .col h3 { margin: 0 0 12px; font-size: 20px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
  .col ul { margin: 0; padding-left: 18px; }
  .col li { font-size: 17px; line-height: 1.42; color: var(--ink-2); margin-bottom: 9px; }

  /* stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 10px; }
  .stat { background: var(--paper-2); border-radius: 10px; padding: 26px 22px; }
  .stat .n { font-size: 60px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; color: var(--ink); }
  .stat .l { margin-top: 12px; font-size: 16px; line-height: 1.4; color: var(--ink-2); }
  .foot { margin-top: auto; font-size: 14.5px; color: var(--ink-3); line-height: 1.45; max-width: 1000px; }

  /* chart */
  .chart-wrap { display: grid; grid-template-columns: 1.15fr 1fr; gap: 36px; flex: 1; }
  .chart-wrap.solo { grid-template-columns: 1fr; }
  .chart-wrap svg { width: 100%; height: auto; display: block; }
  .chart-wrap ul { margin: 0; padding-left: 18px; }
  .chart-wrap li { font-size: 16.5px; line-height: 1.45; color: var(--ink-2); margin-bottom: 12px; }
  .caption { font-size: 13px; color: var(--ink-3); margin-top: 6px; }

  /* ── Chrome: progress, help, notes, download ─────────────────────── */
  #bar { position: fixed; left: 0; bottom: 0; height: 3px; background: var(--accent); width: 0; transition: width .2s; z-index: 3; }
  #hud { position: fixed; top: 12px; right: 14px; display: flex; gap: 8px; z-index: 3; font-size: 12px; }
  #hud a, #hud button { font: inherit; color: var(--on-dark-2); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
    border-radius: 6px; padding: 6px 10px; cursor: pointer; text-decoration: none; }
  #hud a:hover, #hud button:hover { color: #fff; background: rgba(255,255,255,.16); }
  #hud .dl { color: #fff; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  #clock { color: var(--on-dark-2); padding: 6px 4px; font-variant-numeric: tabular-nums; }
  #notes { position: fixed; left: 0; right: 0; bottom: 0; background: #111; color: #ddd; padding: 16px 28px 22px; font-size: 16px; line-height: 1.5;
    border-top: 1px solid #333; display: none; z-index: 2; max-height: 34vh; overflow: auto; }
  #notes.on { display: block; }
  #notes .t { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  #help { position: fixed; left: 14px; bottom: 12px; font-size: 12px; color: #888; z-index: 3; }

  /* overview */
  body.overview #stage { display: block; overflow: auto; padding: 24px; }
  body.overview .slide { display: flex; transform: scale(.25) !important; transform-origin: top left; margin: 0; position: absolute; cursor: pointer; }
  body.overview .slide.active { outline: 6px solid var(--accent); }

  /* print: one slide per page */
  @media print {
    html, body { background: #fff; overflow: visible; height: auto; }
    #stage { position: static; display: block; }
    .slide { display: flex !important; transform: none !important; page-break-after: always; margin: 0 auto; }
    #hud, #bar, #help, #notes { display: none !important; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar"></div>
<div id="hud">
  <span id="clock">00:00</span>
  <button id="btn-notes" title="Toggle speaker notes (N)">Notes</button>
  <button id="btn-over" title="Overview (Esc)">Overview</button>
  <a class="dl" href="aritzia-task-management.pptx" download>Download .pptx</a>
</div>
<div id="notes"><div class="t">Speaker notes</div><div id="notes-body"></div></div>
<div id="help">← → navigate · N notes · Esc overview · T reset timer</div>

<script src="slides.js"></script>
<script>
(function () {
  const { slides } = DECK;
  const stage = document.getElementById("stage");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ── Renderers, one per layout ──────────────────────────────────────
  const R = {
    title: (s) => `
      <div class="title-slide" style="display:flex;flex-direction:column;flex:1">
        <h1>${esc(s.title)}</h1>
        <div class="sub">${esc(s.subtitle)}</div>
        <div class="meta">${s.meta.map((m, i) => `<div class="${i === 0 ? "first" : "mono"}">${esc(m)}</div>`).join("")}</div>
      </div>`,
    close: (s) => `
      <div class="close-slide" style="display:flex;flex-direction:column;flex:1">
        <h1>${esc(s.title)}</h1>
        <div class="lines">${s.lines.map((m, i) => `<div class="${i === 0 ? "first" : "mono"}">${esc(m)}</div>`).join("")}</div>
      </div>`,
    statement: (s) => `
      <div class="statement" style="display:flex;flex-direction:column;flex:1;justify-content:center">
        <h1>${esc(s.title)}</h1>
        ${s.lines.map((l) => `<p>${esc(l)}</p>`).join("")}
      </div>`,
    cards: (s) => `
      <h1>${esc(s.title)}</h1>
      <p class="lead">${esc(s.lead)}</p>
      <div class="cards">${s.cards.map((c) => `<div class="card"><h3>${esc(c.h)}</h3><p>${esc(c.p)}</p></div>`).join("")}</div>`,
    table: (s) => `
      <h1>${esc(s.title)}</h1>
      <p class="lead">${esc(s.lead)}</p>
      <table class="${s.columns.length === 3 ? "three" : ""}">
        <thead><tr>${s.columns.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead>
        <tbody>${s.rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody>
      </table>`,
    trace: (s) => `
      <h1>${esc(s.title)}</h1>
      <div class="trace">${s.steps.map((st) => `
        <div class="step"><div class="label">${esc(st.label)}</div><div class="text ${st.mono ? "mono" : ""}">${esc(st.text)}</div></div>`).join("")}</div>`,
    diagram: (s) => `
      <h1>${esc(s.title)}</h1>
      <p class="lead">${esc(s.lead)}</p>
      <div class="flow">${s.nodes.map((n, i) => `
        ${i ? '<div class="arrow">→</div>' : ""}
        <div class="node"><h3>${esc(n.h)}</h3><ul>${n.lines.map((l) => `<li>${esc(l)}</li>`).join("")}</ul></div>`).join("")}</div>
      <div class="aside">${s.aside.map((a) => `<p>${esc(a)}</p>`).join("")}</div>`,
    columns: (s) => `
      <h1>${esc(s.title)}</h1>
      <p class="lead">${esc(s.lead)}</p>
      <div class="cols n${s.cols.length}">${s.cols.map((c) => `
        <div class="col"><h3>${esc(c.h)}</h3><ul>${c.items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>`,
    stats: (s) => `
      <h1>${esc(s.title)}</h1>
      <p class="lead">${esc(s.lead)}</p>
      <div class="stats">${s.stats.map((st) => `<div class="stat"><div class="n">${esc(st.n)}</div><div class="l">${esc(st.l)}</div></div>`).join("")}</div>
      <p class="foot">${esc(s.foot)}</p>`,
    chart: (s) => `
      <h1>${esc(s.title)}</h1>
      <p class="lead">${esc(s.lead)}</p>
      <div class="chart-wrap ${s.points.length ? "" : "solo"}">
        <div>${chart(s.chart)}</div>
        ${s.points.length ? `<ul>${s.points.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
      </div>`,
  };

  // ── Inline SVG charts ──────────────────────────────────────────────
  function chart(c) {
    if (c.kind === "bars") return bars(c);
    if (c.kind === "dots") return dots(c);
    return "";
  }
  function bars(c) {
    const W = 1120, H = 360, padL = 20, padB = 44, padT = 30;
    const max = Math.max(...c.values.map((v) => v.value)) * 1.15;
    const n = c.values.length, slot = (W - padL) / n, bw = slot * 0.62;
    let out = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cost per builder task">`;
    // gridlines at 5, 10, 15
    for (const g of [5, 10, 15]) {
      const y = padT + (H - padT - padB) * (1 - g / max);
      out += `<line x1="${padL}" x2="${W}" y1="${y}" y2="${y}" stroke="#e5e5e5"/><text x="${padL}" y="${y - 4}" font-size="12" fill="#8a8a8a">$${g}</text>`;
    }
    c.values.forEach((v, i) => {
      const h = (H - padT - padB) * (v.value / max), x = padL + i * slot + (slot - bw) / 2, y = H - padB - h;
      const fill = v.label === "T-08" ? "#e8630a" : "#1a1a1a";
      out += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${fill}"/>`;
      out += `<text x="${x + bw / 2}" y="${y - 8}" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">$${v.value.toFixed(2)}</text>`;
      out += `<text x="${x + bw / 2}" y="${H - padB + 20}" text-anchor="middle" font-size="14" fill="#555">${esc(v.label)}</text>`;
    });
    out += `</svg>`;
    const note = c.values.find((v) => v.note);
    if (note) out += `<div class="caption">* ${esc(note.label)}: ${esc(note.note)}. Orange marks the join-point task.</div>`;
    return out;
  }
  function dots(c) {
    const W = 640, H = 300, padL = 200, padR = 24, rowH = 90, top = 60;
    let out = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.caption)}">`;
    out += `<text x="0" y="24" font-size="15" font-weight="600" fill="#1a1a1a">${esc(c.caption)}</text>`;
    c.series.forEach((s, r) => {
      const y = top + r * rowH + 30;
      out += `<text x="0" y="${y + 5}" font-size="14" fill="#555">${esc(s.label)}</text>`;
      out += `<line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" stroke="#d0d0d0"/>`;
      const fill = r === 0 ? "#1a1a1a" : "#e8630a";
      s.values.forEach((v, i) => {
        const x = padL + v * (W - padL - padR);
        const jitterY = r === 0 ? 0 : 0; // same row; overlap is the point of the first series
        out += `<circle cx="${x}" cy="${y + jitterY}" r="${r === 0 ? 9 : 7}" fill="${fill}" opacity="${r === 0 ? 0.18 : 0.9}"/>`;
      });
      if (r === 0) out += `<text x="${padL + (W - padL - padR)}" y="${y - 16}" text-anchor="end" font-size="12" fill="#8a8a8a">10 clients, one instant</text>`;
    });
    const yA = top + c.series.length * rowH + 8;
    out += `<line x1="${padL}" x2="${W - padR}" y1="${yA}" y2="${yA}" stroke="#1a1a1a"/>`;
    out += `<text x="${padL}" y="${yA + 18}" font-size="12" fill="#8a8a8a">0</text><text x="${W - padR}" y="${yA + 18}" text-anchor="end" font-size="12" fill="#8a8a8a">backoff ceiling</text>`;
    out += `<text x="${padL}" y="${yA + 36}" font-size="12" fill="#8a8a8a">${esc(c.axis)}</text>`;
    out += `</svg>`;
    return out;
  }

  // ── Build the DOM ──────────────────────────────────────────────────
  slides.forEach((s, i) => {
    const el = document.createElement("section");
    el.className = "slide" + (s.layout === "title" || s.layout === "close" ? " dark" : "");
    el.dataset.i = i;
    el.innerHTML = (s.section ? `<div class="section">${esc(s.section)}</div>` : "") + R[s.layout](s) + `<div class="num">${i + 1} / ${slides.length}</div>`;
    el.addEventListener("click", () => { if (document.body.classList.contains("overview")) { go(i); toggleOverview(false); } });
    stage.appendChild(el);
  });
  const els = [...stage.children];
  let cur = 0;

  function fit() {
    const sc = Math.min(window.innerWidth / 1280, (window.innerHeight - (notes.classList.contains("on") ? notes.offsetHeight : 0)) / 720) * 0.96;
    els.forEach((e) => { e.style.transform = `scale(${sc})`; e.style.marginTop = notes.classList.contains("on") ? `-${notes.offsetHeight}px` : "0"; });
    if (document.body.classList.contains("overview")) layoutOverview();
  }
  function layoutOverview() {
    const cols = Math.max(1, Math.floor((window.innerWidth - 48) / (1280 * 0.25 + 16)));
    els.forEach((e, i) => { e.style.left = 24 + (i % cols) * (1280 * 0.25 + 16) + "px"; e.style.top = 24 + Math.floor(i / cols) * (720 * 0.25 + 16) + "px"; });
  }
  function go(i) {
    cur = Math.max(0, Math.min(slides.length - 1, i));
    els.forEach((e, k) => e.classList.toggle("active", k === cur));
    document.getElementById("bar").style.width = ((cur + 1) / slides.length * 100) + "%";
    document.getElementById("notes-body").textContent = slides[cur].notes || "";
    history.replaceState(null, "", "#" + (cur + 1));
  }
  const notes = document.getElementById("notes");
  function toggleNotes() { notes.classList.toggle("on"); fit(); }
  function toggleOverview(force) {
    const on = force === undefined ? !document.body.classList.contains("overview") : force;
    document.body.classList.toggle("overview", on);
    fit();
  }

  // timer
  let t0 = Date.now();
  setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    document.getElementById("clock").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }, 1000);

  document.addEventListener("keydown", (e) => {
    if (["ArrowRight", " ", "PageDown"].includes(e.key)) { e.preventDefault(); go(cur + 1); }
    else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(cur - 1); }
    else if (e.key === "Home") go(0);
    else if (e.key === "End") go(slides.length - 1);
    else if (e.key.toLowerCase() === "n") toggleNotes();
    else if (e.key === "Escape") toggleOverview();
    else if (e.key.toLowerCase() === "t") t0 = Date.now();
  });
  document.getElementById("btn-notes").onclick = toggleNotes;
  document.getElementById("btn-over").onclick = () => toggleOverview();
  window.addEventListener("resize", fit);

  go(Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1));
  fit();
})();
</script>
</body>
</html>
